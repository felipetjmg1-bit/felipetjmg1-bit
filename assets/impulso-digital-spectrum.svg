<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
<title id="title">Impulso Digital | Inteligência em movimento</title>
<desc id="desc">Arte tecnológica animada em quatro cores, com rede neural, órbitas e núcleo luminoso.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07152f"/><stop offset=".48" stop-color="#10113a"/><stop offset="1" stop-color="#071d26"/></linearGradient>
  <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff3b30"><animate attributeName="stop-color" values="#ff3b30;#ffbd2e;#25c56f;#2997ff;#ff3b30" dur="8s" repeatCount="indefinite"/></stop><stop offset=".33" stop-color="#ffbd2e"><animate attributeName="stop-color" values="#ffbd2e;#25c56f;#2997ff;#ff3b30;#ffbd2e" dur="8s" repeatCount="indefinite"/></stop><stop offset=".66" stop-color="#25c56f"><animate attributeName="stop-color" values="#25c56f;#2997ff;#ff3b30;#ffbd2e;#25c56f" dur="8s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#2997ff"><animate attributeName="stop-color" values="#2997ff;#ff3b30;#ffbd2e;#25c56f;#2997ff" dur="8s" repeatCount="indefinite"/></stop></linearGradient>
  <radialGradient id="glow"><stop stop-color="#fff" stop-opacity=".9"/><stop offset=".2" stop-color="#52d8ff" stop-opacity=".55"/><stop offset="1" stop-color="#52d8ff" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
<rect width="1200" height="340" rx="28" fill="url(#bg)"/>
<g opacity=".14" stroke="#8ccfff" stroke-width="1"><path d="M0 70H1200M0 140H1200M0 210H1200M0 280H1200M100 0V340M200 0V340M300 0V340M400 0V340M500 0V340M600 0V340M700 0V340M800 0V340M900 0V340M1000 0V340M1100 0V340"/></g>
<circle cx="930" cy="168" r="145" fill="url(#glow)" filter="url(#blur)"/>
<g fill="none" stroke="url(#spectrum)" stroke-width="2.5" opacity=".85">
  <ellipse cx="930" cy="168" rx="205" ry="72" transform="rotate(-24 930 168)"><animateTransform attributeName="transform" type="rotate" from="0 930 168" to="360 930 168" dur="32s" repeatCount="indefinite"/></ellipse>
  <ellipse cx="930" cy="168" rx="160" ry="112" transform="rotate(42 930 168)"><animateTransform attributeName="transform" type="rotate" from="360 930 168" to="0 930 168" dur="25s" repeatCount="indefinite"/></ellipse>
  <path d="M720 170 Q820 30 930 168 T1140 166"><animate attributeName="stroke-dasharray" values="8 14;30 10;8 14" dur="5s" repeatCount="indefinite"/></path>
</g>
<g stroke="url(#spectrum)" stroke-width="2" fill="none" opacity=".8">
 <path d="M760 85L850 132L930 75L1015 132L1110 90M760 250L850 205L930 265L1015 205L1110 250M850 132L850 205M1015 132L1015 205"/>
</g>
<g fill="url(#spectrum)">
 <circle cx="760" cy="85" r="7"><animate attributeName="r" values="5;10;5" dur="2.5s" repeatCount="indefinite"/></circle><circle cx="850" cy="132" r="6"/><circle cx="930" cy="75" r="8"><animate attributeName="r" values="6;12;6" dur="2s" repeatCount="indefinite"/></circle><circle cx="1015" cy="132" r="6"/><circle cx="1110" cy="90" r="7"/><circle cx="760" cy="250" r="7"/><circle cx="850" cy="205" r="6"/><circle cx="930" cy="265" r="8"><animate attributeName="r" values="6;11;6" dur="2.2s" repeatCount="indefinite"/></circle><circle cx="1015" cy="205" r="6"/><circle cx="1110" cy="250" r="7"/>
</g>
<circle cx="930" cy="168" r="52" fill="url(#glow)"/>
<circle cx="930" cy="168" r="28" fill="none" stroke="url(#spectrum)" stroke-width="3"><animate attributeName="r" values="24;34;24" dur="3s" repeatCount="indefinite"/></circle>
<g font-family="Segoe UI,Arial,sans-serif">
 <text x="66" y="104" fill="#9bdcff" font-size="17" font-weight="700" letter-spacing="5">IMPULSO DIGITAL</text>
 <text x="64" y="163" fill="#fff" font-size="43" font-weight="800">INTELIGÊNCIA</text>
 <text x="64" y="211" fill="url(#spectrum)" font-size="43" font-weight="800">EM MOVIMENTO</text>
 <text x="67" y="252" fill="#c7d7ed" font-size="17">IA multimodal • XAI • Engenharia • Soberania tecnológica</text>
 <rect x="67" y="278" width="270" height="4" rx="2" fill="url(#spectrum)"/>
</g>
<rect x="1" y="1" width="1198" height="338" rx="27" fill="none" stroke="url(#spectrum)" stroke-width="2" opacity=".85"/>
