<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
<title id="title">Impulso Digital | Inteligência em movimento</title>
<desc id="desc">Banner animado de alta legibilidade com identidade tecnológica em quatro cores.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06142b"/><stop offset=".52" stop-color="#10183b"/><stop offset="1" stop-color="#062b32"/></linearGradient>
 <linearGradient id="spectrum"><stop stop-color="#ff453a"><animate attributeName="stop-color" values="#ff453a;#ffcc32;#22c879;#2997ff;#ff453a" dur="9s" repeatCount="indefinite"/></stop><stop offset=".34" stop-color="#ffcc32"><animate attributeName="stop-color" values="#ffcc32;#22c879;#2997ff;#ff453a;#ffcc32" dur="9s" repeatCount="indefinite"/></stop><stop offset=".68" stop-color="#22c879"><animate attributeName="stop-color" values="#22c879;#2997ff;#ff453a;#ffcc32;#22c879" dur="9s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#2997ff"><animate attributeName="stop-color" values="#2997ff;#ff453a;#ffcc32;#22c879;#2997ff" dur="9s" repeatCount="indefinite"/></stop></linearGradient>
 <radialGradient id="glow"><stop stop-color="#fff" stop-opacity=".8"/><stop offset=".25" stop-color="#38cfff" stop-opacity=".35"/><stop offset="1" stop-color="#38cfff" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
</defs>
<rect width="1600" height="560" rx="36" fill="url(#bg)"/>
<g opacity=".12" stroke="#a4dfff"><path d="M0 100H1600M0 200H1600M0 300H1600M0 400H1600M0 500H1600M100 0V560M200 0V560M300 0V560M400 0V560M500 0V560M600 0V560M700 0V560M800 0V560M900 0V560M1000 0V560M1100 0V560M1200 0V560M1300 0V560M1400 0V560M1500 0V560" fill="none"/></g>
<circle cx="1260" cy="280" r="260" fill="url(#glow)" filter="url(#blur)"/>
<g fill="none" stroke="url(#spectrum)" stroke-width="3" opacity=".9">
 <ellipse cx="1260" cy="280" rx="260" ry="98" transform="rotate(-25 1260 280)"><animateTransform attributeName="transform" type="rotate" from="0 1260 280" to="360 1260 280" dur="38s" repeatCount="indefinite"/></ellipse>
 <ellipse cx="1260" cy="280" rx="205" ry="150" transform="rotate(36 1260 280)"><animateTransform attributeName="transform" type="rotate" from="360 1260 280" to="0 1260 280" dur="31s" repeatCount="indefinite"/></ellipse>
 <ellipse cx="1260" cy="280" rx="150" ry="210" transform="rotate(-58 1260 280)"><animateTransform attributeName="transform" type="rotate" from="0 1260 280" to="360 1260 280" dur="45s" repeatCount="indefinite"/></ellipse>
</g>
<g stroke="url(#spectrum)" stroke-width="3" fill="none" opacity=".85"><path d="M1060 145L1150 205L1260 120L1370 205L1470 145M1060 415L1150 355L1260 440L1370 355L1470 415M1150 205V355M1370 205V355"/></g>
<g fill="url(#spectrum)"><circle cx="1060" cy="145" r="10"/><circle cx="1150" cy="205" r="9"/><circle cx="1260" cy="120" r="12"><animate attributeName="r" values="9;15;9" dur="2.4s" repeatCount="indefinite"/></circle><circle cx="1370" cy="205" r="9"/><circle cx="1470" cy="145" r="10"/><circle cx="1060" cy="415" r="10"/><circle cx="1150" cy="355" r="9"/><circle cx="1260" cy="440" r="12"/><circle cx="1370" cy="355" r="9"/><circle cx="1470" cy="415" r="10"/></g>
<circle cx="1260" cy="280" r="90" fill="url(#glow)"/><circle cx="1260" cy="280" r="52" fill="none" stroke="url(#spectrum)" stroke-width="5"><animate attributeName="r" values="44;62;44" dur="3s" repeatCount="indefinite"/></circle>
<g font-family="Segoe UI,Arial,sans-serif">
 <text x="92" y="138" fill="#9bdcff" font-size="29" font-weight="800" letter-spacing="8">IMPULSO DIGITAL</text>
 <text x="88" y="250" fill="#ffffff" font-size="86" font-weight="900" letter-spacing="-2">INTELIGÊNCIA</text>
 <text x="88" y="350" fill="url(#spectrum)" font-size="86" font-weight="900" letter-spacing="-2">EM MOVIMENTO</text>
 <text x="94" y="420" fill="#d6e7f8" font-size="30" font-weight="600">IA MULTIMODAL  •  XAI  •  ENGENHARIA DE SOFTWARE</text>
 <text x="94" y="468" fill="#a9c6df" font-size="25">Pesquisa aplicada, sistemas explicáveis e tecnologia brasileira</text>
 <rect x="94" y="500" width="580" height="7" rx="4" fill="url(#spectrum)"/>
</g>
<rect x="2" y="2" width="1596" height="556" rx="34" fill="none" stroke="url(#spectrum)" stroke-width="3"/>
</svg>