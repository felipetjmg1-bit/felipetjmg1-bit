<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440" role="img" aria-labelledby="title desc">
<title id="title">Impulso Digital | Soberania Nacional Tecnológica</title>
<desc id="desc">Robô de inteligência artificial, mapa luminoso do Brasil, circuitos e luzes neon nas cores verde, amarelo e azul.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#020817"/><stop offset=".55" stop-color="#061b2e"/><stop offset="1" stop-color="#020817"/></linearGradient>
  <linearGradient id="gold"><stop stop-color="#ffe86b"/><stop offset=".5" stop-color="#ffbd18"/><stop offset="1" stop-color="#fff1a6"/></linearGradient>
  <linearGradient id="green"><stop stop-color="#00ff83"/><stop offset="1" stop-color="#a7ff32"/></linearGradient>
  <linearGradient id="blue"><stop stop-color="#00d9ff"/><stop offset="1" stop-color="#236bff"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#1a6b82" stroke-opacity=".22" stroke-width="1"/></pattern>
</defs>
<rect width="1600" height="440" rx="28" fill="url(#bg)"/><rect width="1600" height="440" rx="28" fill="url(#grid)"/>
<ellipse cx="810" cy="430" rx="650" ry="115" fill="#00d9ff" opacity=".13" filter="url(#soft)"/>
<path d="M0 365 Q400 270 800 370 T1600 340" fill="none" stroke="url(#green)" stroke-width="3" opacity=".8" filter="url(#glow)"/>
<path d="M0 390 Q400 295 800 395 T1600 365" fill="none" stroke="url(#blue)" stroke-width="3" opacity=".8" filter="url(#glow)"/>
